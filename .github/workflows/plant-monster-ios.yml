name: Plant Monster iOS

on:
  push:
    branches:
      - codex/plant-monster-ios
    paths:
      - "plant-monster-ios/**"
      - ".github/workflows/plant-monster-ios.yml"
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Archive and upload this build to TestFlight"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: plant-monster-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile without signing
    runs-on: macos-26
    defaults:
      run:
        working-directory: plant-monster-ios
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile simulator build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project PlantMonster.xcodeproj \
            -scheme PlantMonster \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/plant-monster-xcodebuild.log"
          build_status=${PIPESTATUS[0]}
          if [[ "$build_status" -ne 0 ]]; then
            errors=$(grep -E "(^|[[:space:]])(error|fatal error):" "$RUNNER_TEMP/plant-monster-xcodebuild.log" | tail -80 || true)
            diagnostic="${errors:-$(tail -100 "$RUNNER_TEMP/plant-monster-xcodebuild.log")}"
            {
              echo "### Xcode compile errors"
              echo '```text'
              printf '%s\n' "$diagnostic"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            diagnostic="${diagnostic:0:7000}"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Xcode compile failed::$diagnostic"
            exit "$build_status"
          fi

  testflight:
    name: Upload to TestFlight
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.upload_testflight) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[testflight]'))
    needs: build
    runs-on: macos-26
    environment: testflight
    defaults:
      run:
        working-directory: plant-monster-ios
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_PROFILE_ID: VMRYKKY4BG
      IOS_PROFILE_NAME: Plant Monster App Store 2026-09-24
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            APPLE_TEAM_ID \
            ASC_KEY_ID \
            ASC_ISSUER_ID \
            ASC_API_KEY_P8_BASE64 \
            IOS_DISTRIBUTION_P12_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Install XcodeGen and OpenSSL
        run: brew install xcodegen openssl@3

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          echo "AUTH_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Install distribution signing assets
        shell: bash
        run: |
          set -euo pipefail

          keychain_path="$RUNNER_TEMP/plant-monster-signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate_bundle_path="$RUNNER_TEMP/plant-monster-distribution.p12"
          signing_pem_path="$RUNNER_TEMP/plant-monster-distribution.pem"
          compatible_bundle_path="$RUNNER_TEMP/plant-monster-distribution-compatible.p12"
          compatible_bundle_password="github-actions-temporary"
          profile_path="$RUNNER_TEMP/PlantMonster.mobileprovision"
          profile_plist="$RUNNER_TEMP/PlantMonsterProfile.plist"
          openssl_bin="$(brew --prefix openssl@3)/bin/openssl"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 -D > "$certificate_bundle_path"
          "$openssl_bin" pkcs12 \
            -in "$certificate_bundle_path" \
            -nodes \
            -passin pass: \
            -out "$signing_pem_path"
          "$openssl_bin" pkcs12 \
            -export \
            -legacy \
            -in "$signing_pem_path" \
            -out "$compatible_bundle_path" \
            -passout "pass:$compatible_bundle_password"
          security import "$compatible_bundle_path" \
            -P "$compatible_bundle_password" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          cat > "$RUNNER_TEMP/download-profile.mjs" <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const encode = (value) => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const unsignedToken = [
            encode({ alg: 'ES256', kid: process.env.ASC_KEY_ID, typ: 'JWT' }),
            encode({
              iss: process.env.ASC_ISSUER_ID,
              iat: now - 20,
              exp: now + 600,
              aud: 'appstoreconnect-v1',
            }),
          ].join('.');
          const signature = crypto.sign(
            'sha256',
            Buffer.from(unsignedToken),
            {
              key: fs.readFileSync(process.env.AUTH_KEY_PATH),
              dsaEncoding: 'ieee-p1363',
            },
          ).toString('base64url');
          const response = await fetch(
            `https://api.appstoreconnect.apple.com/v1/profiles/${process.env.IOS_PROFILE_ID}`,
            { headers: { Authorization: `Bearer ${unsignedToken}.${signature}` } },
          );
          if (!response.ok) {
            throw new Error(`Unable to download provisioning profile (${response.status}).`);
          }
          const payload = await response.json();
          fs.writeFileSync(process.argv[2], Buffer.from(payload.data.attributes.profileContent, 'base64'));
          NODE
          node "$RUNNER_TEMP/download-profile.mjs" "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          installed_profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$installed_profiles"
          cp "$profile_path" "$installed_profiles/${profile_uuid}.mobileprovision"

          echo "SIGNING_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"

      - name: Archive signed app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project PlantMonster.xcodeproj \
            -scheme PlantMonster \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/PlantMonster.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$IOS_PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN_PATH" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Create export options
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.hkminijungle.plantmonster</key>
              <string>${IOS_PROFILE_NAME}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Validate archived bundle metadata
        shell: bash
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/PlantMonster.xcarchive/Products/Applications/PlantMonster.app"
          info_path="$app_path/Info.plist"
          for key in CFBundleIconName UILaunchStoryboardName UISupportedInterfaceOrientations; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$info_path"
          done
          icon_path="$(find "$app_path" -maxdepth 1 -type f -name 'AppIcon*.png' -print -quit)"
          if [[ -z "$icon_path" ]]; then
            echo "The archived app does not contain compiled app icon files." >&2
            exit 1
          fi

      - name: Upload archive to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PlantMonster.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/PlantMonsterExport" \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Wait for processing and assign internal group
        env:
          TESTFLIGHT_APP_ID: "6815591868"
          TESTFLIGHT_GROUP_NAME: Plant Monster Internal
        run: node Scripts/sync-testflight.mjs "$GITHUB_RUN_NUMBER"

  sync_testflight:
    name: Verify TestFlight visibility
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[sync-testflight:')
    runs-on: ubuntu-latest
    environment: testflight
    defaults:
      run:
        working-directory: plant-monster-ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      TESTFLIGHT_APP_ID: "6815591868"
      TESTFLIGHT_GROUP_NAME: Plant Monster Internal
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Read target build number
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          build_number="$(printf '%s' "$COMMIT_MESSAGE" | sed -n 's/.*\[sync-testflight:\([0-9][0-9]*\)\].*/\1/p')"
          if [[ -z "$build_number" ]]; then
            echo "Commit message must contain [sync-testflight:<build-number>]." >&2
            exit 1
          fi
          echo "TARGET_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -d > "$key_path"
          chmod 600 "$key_path"
          echo "AUTH_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Verify processing and internal group assignment
        run: node Scripts/sync-testflight.mjs "$TARGET_BUILD_NUMBER"
