name: PlantMonster
options:
  bundleIdPrefix: com.hkminijungle
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PlantMonster:
    type: application
    platform: iOS
    sources:
      - path: PlantMonster
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
          - Assets.xcassets
          - Resources
    resources:
      - path: PlantMonster/Assets.xcassets
      - path: PlantMonster/Resources
      - path: PlantMonster/PrivacyInfo.xcprivacy
    info:
      path: PlantMonster/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hkminijungle.plantmonster
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
  PlantMonsterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlantMonsterTests
    dependencies:
      - target: PlantMonster
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hkminijungle.plantmonster.tests
